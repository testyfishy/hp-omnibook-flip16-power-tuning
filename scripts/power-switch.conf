# power-switch: numbers used by /usr/local/sbin/power-switch.sh  (watts / MHz). Edit and unplug/replug to apply.
BAT_PROFILE=power-saver
BAT_PL1=6          # sustained package power on battery (whole SoC: CPU cores + iGPU + NPU). Chip max is 30.
BAT_PL2=6          # short bursts (~1 s) on battery
BAT_GPU_MAX=1500    # iGPU max MHz on battery (hardware max 2050)
AC_PROFILE=balanced
AC_PL1=30
AC_PL2=37
AC_GPU_MAX=2050
# CPU energy-performance preference applied AFTER the profile (empty = leave what power-profiles-daemon set).
# Measured 19 Sep 2026 at 6/6 W: balance_power = single-thread tasks 30-44 % faster than 'power' for ~2 % more SoC energy.
BAT_EPP=balance_power
AC_EPP=
